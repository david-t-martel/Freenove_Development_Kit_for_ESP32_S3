;; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:freenove_esp32_s3_wroom]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = espidf
monitor_speed = 115200
monitor_filters = direct, esp32_exception_decoder
board_build.partitions = default.csv
board_build.embed_txtfiles =
  src/certs/ca_cert.pem
  src/data/test.mp3

; Run ESP-IDF component manager script to handle dependencies
extra_scripts =
  pre:configure_esp_idf_components.py

; Required build flags for ESP32-S3 and LVGL
build_flags =
  -DCONFIG_LWIP_IPV6=0
  -DCONFIG_FREERTOS_HZ=1000
  ; LVGL configurations
  -DLV_CONF_INCLUDE_SIMPLE=1
  -DLV_COLOR_DEPTH=16
  -DLV_COLOR_16_SWAP=1
  ; Increase stack size for LVGL task
  -DCONFIG_LVGL_TASK_STACK_SIZE=8192
  ; SD Card configurations
  -DCONFIG_SDMMC_USE_GPIO_MATRIX=1
  ; Camera configurations
  -DCONFIG_CAMERA_MODULE_ESP_EYE=1
  ; Audio configurations
  -DCONFIG_I2S_ISR_IRAM=1

; Define upload port - change to match your COM port
upload_port = COM3
upload_speed = 921600

; Debug settings
debug_tool = esp-prog
debug_init_break = tbreak setup app_main

; For any custom components you develop
lib_extra_dirs =
  components

; Include path for ESP-IDF and project components
build_unflags = -I.

; Specific defines and flags for ESP-IDF components
board_build.embed_files =
  components/lvgl_esp32_drivers/lvgl_tft/fonts/*.ttf
