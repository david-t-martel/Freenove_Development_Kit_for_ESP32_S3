[env:freenove_esp32_s3_wroom]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = espidf
monitor_speed = 115200
monitor_filters = direct, esp32_exception_decoder
board_build.partitions = partitions.csv

; Add component directories to include paths
build_flags =
  -DCONFIG_LWIP_IPV6=0
  -DCONFIG_FREERTOS_HZ=1000
  ; LVGL configurations
  -DLV_CONF_INCLUDE_SIMPLE=1
  -DLV_COLOR_DEPTH=16
  -DLV_COLOR_16_SWAP=1
  ; Increase stack size for LVGL task
  -DCONFIG_LVGL_TASK_STACK_SIZE=8192
  ; SD Card configurations
  -DCONFIG_SDMMC_USE_GPIO_MATRIX=1
  ; Audio configurations
  -DCONFIG_I2S_ISR_IRAM=1

; Component directories
build_unflags =
  -I.

; Make IntelliSense aware of the component paths
build_src_filter =
  +<main/>
  +<components/>

; Include extra directories for build and IntelliSense
extra_scripts =
  pre:tools/configure_esp_idf_components.py

; Custom include paths for components
board_build.include_dirs =
  components/display/include
  components/ft6336u/include
  components/main_ui/include
  components/camera/include
  components/sd_card/include
  components/audio/include
  components/heartrate/include
  components/driver_test/include
  components/sound_ui/include
  components/utils/include
  main/include

; Ensure components are built
board_build.embed_files =
  components
