;; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:freenove_esp32_s3_wroom]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = espidf
monitor_speed = 115200
monitor_filters = direct
board_build.partitions = default.csv
board_build.embed_txtfiles =
  src/certs/ca_cert.pem

; Run ESP-IDF component manager script to handle dependencies
extra_scripts =
  pre:configure_esp_idf_components.py

; Required build flags for ESP32-S3 and LVGL
build_flags =
  -DCONFIG_LWIP_IPV6=0
  -DCONFIG_FREERTOS_HZ=1000
  -DLV_CONF_INCLUDE_SIMPLE

; Define upload port - change to match your COM port
upload_port = COM3
upload_speed = 921600

; Debug settings
debug_tool = esp-prog
debug_init_break = tbreak app_main

; Include path for ESP-IDF and project components
build_unflags = -I.
build_src_filter = +<*> -<.git/> -<.svn/>

; Specific defines and flags for ESP-IDF components
board_build.embed_files =
  components/lvgl_esp32_drivers/lvgl_tft/fonts/*.ttf
