;; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:freenove_esp32_s3_wroom]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = espidf
monitor_speed = 115200
monitor_filters = direct
board_build.partitions = default.csv
board_build.embed_txtfiles =
  src/certs/ca_cert.pem

; LVGL component will be pulled from ESP-IDF component registry
; Components to include in the build
extra_scripts =
  pre:configure_esp_idf_components.py

build_flags =
  -DCONFIG_LWIP_IPV6=0
  -DCONFIG_FREERTOS_HZ=1000

lib_deps =
    lvgl/lvgl@^8.3.9
    bodmer/TFT_eSPI@^2.5.0
    # Add other libraries as needed
    # Add any additional libraries required for your project here
